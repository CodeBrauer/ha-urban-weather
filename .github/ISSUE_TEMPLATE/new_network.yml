---
name: "Network proposal"
description: "Propose a city climate network the integration should support"
title: "Network: "
labels:
  - "network: research-needed"
body:
- type: markdown
  attributes:
    value: |
      Replace the title suffix with the city and country, e.g. `Network: Dortmund (DE)`. Search the [existing network issues](https://github.com/CodeBrauer/ha-urban-weather/issues?q=is%3Aissue%20%22Network%3A%22%20in%3Atitle) first.

      A network can be supported when it has live values (updated at least hourly), a licence that allows reuse, stations across the city, and access without a login. Fill in what you know; the rest is researched later.
- type: input
  id: city
  attributes:
    label: "City / region"
    placeholder: "Dortmund, Germany"
  validations:
    required: true
- type: input
  id: network
  attributes:
    label: "Network, operator"
    placeholder: "Klimamessnetz Dortmund, Data2Resilience (Ruhr University Bochum)"
  validations:
    required: true
- type: input
  id: stations
  attributes:
    label: "Stations"
    placeholder: "107 sensors at 76 locations"
- type: input
  id: measurements
  attributes:
    label: "Measurements"
    placeholder: "temperature, humidity; some stations also wind, pressure, precipitation"
- type: dropdown
  id: access
  attributes:
    label: "Access"
    options:
      - "official API"
      - "open data export"
      - "undocumented API"
      - "scraping"
      - "no public access"
- type: dropdown
  id: platform
  attributes:
    label: "Platform"
    options:
      - "Opendatasoft"
      - "WFS"
      - "SensorThings"
      - "ArcGIS"
      - "FIWARE"
      - "CKAN"
      - "own"
- type: textarea
  id: endpoints
  attributes:
    label: "Endpoints, docs"
    description: "URLs of the API, the dataset or the documentation."
- type: input
  id: freshness
  attributes:
    label: "Freshness"
    description: "How often new values arrive, and whether all stations come in one request."
    placeholder: "5 minutes; all stations in one request"
- type: input
  id: auth
  attributes:
    label: "Auth, limits"
    placeholder: "none; limits unknown"
- type: dropdown
  id: licence
  attributes:
    label: "Licence"
    options:
      - "dl-zero"
      - "dl-by"
      - "CC0"
      - "CC BY"
      - "CC BY-SA"
      - "CC BY-NC"
      - "not stated"
- type: input
  id: integrations
  attributes:
    label: "Home Assistant integrations"
    description: "Existing integrations that already use this network."
- type: textarea
  id: quirks
  attributes:
    label: "Quirks"
    description: "Anything unusual: units, stale records, sensor types, gaps."
- type: input
  id: contact
  attributes:
    label: "Operator contact"
- type: checkboxes
  id: checklist
  attributes:
    label: "Checklist"
    description: "The same 12 points for every network issue, defined in the [network catalog epic](https://github.com/CodeBrauer/ha-urban-weather/issues/33). Tick only what you have confirmed; the rest is checked during research."
    options:
      - label: "Operator known and network running (not planned, under construction or ended)"
      - label: "Stations across the city: count and spread confirmed, positions published"
      - label: "Air temperature measured, list of fields confirmed"
      - label: "Operator contact found (for licence, endpoint and limit questions)"
      - label: "Machine-readable endpoint (API, WFS, file), not only a dashboard"
      - label: "No login: no account, and no key unless the operator publishes it for everyone"
      - label: "Live values: a live response showed values updated at least hourly"
      - label: "All stations in one or a few requests, within the request budget"
      - label: "Limits checked: documented rate limits, quotas and User-Agent rules, or their absence"
      - label: "Licence allows reuse, stated by the operator or its data portal"
      - label: "Data format understood: ids, positions, timestamps and time zone, units, stale records"
      - label: "Limits, planned budget and open decisions agreed in this issue"

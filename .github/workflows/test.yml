name: Test

on:
  push:
    branches:
      - "main"
      - "next"
  pull_request:
    branches:
      - "main"
      - "next"

permissions: {}

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements_dev.txt

      - name: Install requirements
        run: python3 -m pip install -r requirements_dev.txt

      - name: Run tests
        run: >-
          python3 -m pytest --cov=custom_components.urban_weather
          --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codacy
        # Informational only; fails without the secret (e.g. pull requests from forks).
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
          coverage-reporter-version: "14.1.3"

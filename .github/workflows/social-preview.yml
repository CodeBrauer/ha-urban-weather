name: Social preview

# Renders the social preview image from scripts/social_preview.py and keeps it for a
# week as a workflow artifact. GitHub has no API to set the image: the maintainer
# uploads it under Settings -> Social preview.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      issue:
        description: "Network issue to comment on (number, optional)"
        required: false
        type: string

permissions: {}

jobs:
  render:
    name: "Render the social preview"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Helvetica Neue is macOS only; Liberation Sans is the fallback of the font stack.
      - name: Install the renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin fonts-liberation

      - name: Render the image
        run: |
          python3 scripts/social_preview.py "$RUNNER_TEMP/social-preview.svg"
          rsvg-convert -w 1280 "$RUNNER_TEMP/social-preview.svg" -o "$RUNNER_TEMP/social-preview.png"

      - name: Upload the image
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/social-preview.png
          archive: false
          retention-days: 7

      # Network issues referenced in the release notes, or the one given to a manual run.
      - name: Comment on the network issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
          ISSUE: ${{ inputs.issue }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          if [[ -n "$ISSUE" ]]; then
            numbers="${ISSUE#\#}"
          else
            numbers=$(grep -oE '#[0-9]+' <<<"$RELEASE_NOTES" | tr -d '#' | sort -un || true)
          fi

          expires=$(date -u -d '+7 days' +%Y-%m-%d)
          body="Social preview${TAG:+ for $TAG} with this network: [social-preview.png]($ARTIFACT_URL) (kept until $expires). Upload it under Settings → Social preview.

          Rendered by the [Social preview workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`scripts/social_preview.py\`."

          for number in $numbers; do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            # A number that is no issue or pull request is skipped; other errors (token,
            # rate limit) fail the run instead of leaving out the comment silently.
            if ! title=$(gh issue view "$number" --json title --jq .title 2>"$RUNNER_TEMP/error"); then
              grep -q "Could not resolve to an issue or pull request" "$RUNNER_TEMP/error" && continue
              cat "$RUNNER_TEMP/error" >&2
              exit 1
            fi
            if [[ "$title" == Network:* ]]; then
              gh issue comment "$number" --body "$body"
              echo "Commented on #$number ($title)."
            fi
          done
          echo "[social-preview.png]($ARTIFACT_URL)" >>"$GITHUB_STEP_SUMMARY"

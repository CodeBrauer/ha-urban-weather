name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  zip:
    name: Attach integration ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HACS extracts the ZIP into custom_components/urban_weather (hacs.json).
      - name: Build the ZIP
        working-directory: custom_components/urban_weather
        run: zip -r "$RUNNER_TEMP/urban_weather.zip" .

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/urban_weather.zip" --clobber --repo "$GITHUB_REPOSITORY"
